name: Test CLI

# `.devcontainer/**` (repo root) is deliberately absent, despite #102's own
# text assuming it belonged here. Verified: the unit suite's
# devcontainer_files_test.py mocks get_embedded_devcontainer_dir with a fake
# directory rather than reading the real one, and the file this lane's CLI
# actually ships is the separate embedded copy at
# src/lamp_the_djinn/devcontainer/ (already covered by `src/**` -- diff
# confirms the two trees are not even byte-identical). No unit or
# integration test reads the repo-root `.devcontainer/`; only
# test-container.yml, docker-publish.yml and the two devcontainer lint
# lanes do.

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      # Deps this lane installs via `uv sync`, plus [tool.pytest.ini_options]
      # (the unit/integration marker config both jobs select on).
      - 'pyproject.toml'
      - '.github/workflows/test-cli.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test-cli.yml'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install project + dev dependencies
        run: uv sync --python 3.12

      - name: Run unit tests
        # Unit tier: colocated next to source (src/**/*_test.py), marked `unit`.
        run: uv run pytest src -m unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install project + dev dependencies
        run: uv sync --python 3.12

      - name: Run integration tests
        # Integration tier (tests/integration), marked `integration`: first-party
        # code runs for real against the host filesystem/env; collaborators
        # (Docker, subprocess, network) are mocked, so no container is needed.
        run: uv run pytest tests/integration -m integration
