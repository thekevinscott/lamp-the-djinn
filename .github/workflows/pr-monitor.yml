name: PR Monitor

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  check_commit_status:
    name: 'Check Commit Status'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: thekevinscott/pr-monitor@v1
