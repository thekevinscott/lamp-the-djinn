name: Testing Conventions

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'testing-conventions.toml'
      - 'e2e-attestations/**'
      - '.github/workflows/conventions.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'testing-conventions.toml'
      - 'e2e-attestations/**'
      - '.github/workflows/conventions.yml'

permissions:
  contents: read

jobs:
  conventions:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["python"]'
      source: src
      gates: '["colocated-test", "one-function-per-file", "unit-lint", "unit-coverage", "integration-lint", "mutation", "packaging", "e2e-verify"]'
