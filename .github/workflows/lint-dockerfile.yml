name: Lint Dockerfile

# Scoped out of the old `Lint` workflow. See #102.
#
# Only `.devcontainer/Dockerfile` is in the trigger because that is the only
# file hadolint is pointed at. The shipped copy at
# src/lamp_the_djinn/devcontainer/Dockerfile goes unlinted -- separate concern,
# tracked in #103.

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/Dockerfile'
      - '.github/workflows/lint-dockerfile.yml'
  pull_request:
    branches: [main]
    paths:
      - '.devcontainer/Dockerfile'
      - '.github/workflows/lint-dockerfile.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hadolint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download hadolint
        run: |
          curl -sL -o hadolint "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64"
          chmod +x hadolint

      # Ignored rules:
      # DL3008: Pin versions in apt-get - not practical for devcontainer
      # DL3059: Multiple consecutive RUN - intentional for caching
      # DL4006: Set SHELL option -o pipefail - we use default shell
      # SC1091: Can't follow sourced file - external scripts
      - name: Run Hadolint
        continue-on-error: true
        run: |
          echo "=== Running hadolint on .devcontainer/Dockerfile ==="
          ./hadolint --version
          ./hadolint .devcontainer/Dockerfile
