name: Lint Dockerfile

# Scoped out of the old `Lint` workflow. See #102.
# Lints both cage Dockerfiles: .devcontainer/Dockerfile and
# src/lamp_the_djinn/devcontainer/Dockerfile (packaged local-build fallback).

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/Dockerfile'
      - 'src/lamp_the_djinn/devcontainer/Dockerfile'
      - '.hadolint.yaml'
      - '.github/workflows/lint-dockerfile.yml'
  pull_request:
    branches: [main]
    paths:
      - '.devcontainer/Dockerfile'
      - 'src/lamp_the_djinn/devcontainer/Dockerfile'
      - '.hadolint.yaml'
      - '.github/workflows/lint-dockerfile.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hadolint:
    name: Hadolint (Dockerfiles)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download hadolint
        run: |
          curl -sL -o hadolint "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64"
          chmod +x hadolint

      # Ignored rules from .hadolint.yaml: DL3008 (pin apt versions) not
      # practical for either image; DL3059 (multiple RUN) intentional for caching.
      - name: Run Hadolint on the devcontainer Dockerfile
        run: ./hadolint .devcontainer/Dockerfile

      - name: Run Hadolint on the packaged cage Dockerfile
        run: ./hadolint src/lamp_the_djinn/devcontainer/Dockerfile
